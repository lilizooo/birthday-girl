<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday :D</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgb(245, 244, 177);
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            width: 100%;
            min-height: 100vh;
            padding: 14px 16px 20px;
            box-sizing: border-box;
            transform: translateY(12px);
        }

        .cake-text {
            margin: 0 0 22px;
            font-size: clamp(1.6rem, 2.3vw, 2.5rem);
            color: #2f2f2f;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: regular;
            text-align: center;
        }

        .center-image {
            display: block;
            width: min(620px, 78vw);
            max-width: 100%;
            height: auto;
            object-fit: contain;
            margin-top: 0;
        }

        .top-left-star {
            position: fixed;
            top: -20px;
            left: -18px;
            width: min(280px, 34vw);
            max-width: 100%;
            height: auto;
            display: block;
            z-index: 5;
            pointer-events: none;
        }

        .bottom-right-flower {
            position: fixed;
            right: 16px;
            bottom: 10px;
            width: min(220px, 26vw);
            max-width: 100%;
            height: auto;
            display: block;
            z-index: 5;
            pointer-events: none;
        }

        .back-button {
            position: fixed;
            left: 22px;
            bottom: 22px;
            padding: 10px 16px;
            border: 2px solid #0f4c81;
            border-radius: 999px;
            background: #2d7ad8;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            z-index: 10;
        }
    </style>
</head>
<body>
    <img class="top-left-star" src="pics/starz.png" alt="Star decoration">
    <img class="bottom-right-flower" src="pics/flower.png" alt="Flower decoration">

    <div class="content">
        <h1 class="cake-text">CAKE FOR YOU</h1>
        <img class="center-image" src="pics/cutu.png" alt="Birthday image">
    </div>

    <a class="back-button" href="star.html">Back</a>
</body>
</html>
