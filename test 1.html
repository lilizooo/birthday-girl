<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday :D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: rgb(245, 244, 177);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .bottom-corner-rose {
            position: fixed;
            right: -82px;
            bottom: -42px;
            width: min(420px, 48vw);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            opacity: 0.9;
        }

        .top-left-waves {
            position: fixed;
            left: 0;
            top: 0;
            width: min(620px, 66vw);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            opacity: 0.9;
        }

        .top-right-balloon {
            position: fixed;
            right:-80px;
            top: 0;
            width: min(280px, 32vw);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            z-index: 2;
        }

        .bottom-left-cake {
            position: fixed;
            left: 0;
            bottom: -100px;
            width: min(220px, 26vw);
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            z-index: 2;
        }

        .gift-stack {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateY(10px);
        }

        .gift-heading {
            margin: 0 0 22px;
            font-size: clamp(1.6rem, 2.3vw, 2.5rem);
            color: #2f2f2f;
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            text-align: center;
        }

        .gift-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 36px;
            padding: 0 20px 20px;
        }

        .gift-card {
            width: auto;
            aspect-ratio: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            transition: transform 0.2s ease;
            text-decoration: none;
        }

        .gift-card:hover {
            transform: translateY(-6px);
            box-shadow: none;
        }

        .gift-card img {
            display: block;
            width: min(270px, 32vw);
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .bottom-center-back {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            padding: 12px 22px;
            border: 2px solid #0f4c81;
            border-radius: 999px;
            background: #2d7ad8;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            z-index: 10;
        }
    </style>
</head>
<body>
    <img class="top-left-waves" src="pics/waves.png" alt="Waves decoration">
    <img class="top-right-balloon" src="pics/balon.png" alt="Balloon decoration">
    <img class="bottom-left-cake" src="pics/caik.png" alt="Cake decoration">
    <img class="bottom-corner-rose" src="pics/roses.png" alt="Roses">

    <div class="gift-stack">
        <h2 class="gift-heading">pick gift :D</h2>
        <div class="gift-row">
            <a class="gift-card" href="gift1.html" aria-label="Open gift 1">
                <img src="pics/gift.png" alt="Gift 1">
            </a>
            <a class="gift-card" href="gift2.html" aria-label="Open gift 2">
                <img src="pics/gift.png" alt="Gift 2">
            </a>
            <a class="gift-card" href="gift3.html" aria-label="Open gift 3">
                <img src="pics/gift.png" alt="Gift 3">
            </a>
        </div>
    </div>

    <a class="bottom-center-back" href="card.html">Back</a>
</body>
</html>
